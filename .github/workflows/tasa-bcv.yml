name: Tasa BCV
# Lee la tasa oficial del Banco Central de Venezuela y la guarda en tasa.json para la app.
on:
  schedule:
    # GitHub a veces se salta corridas programadas, así que revisamos cada hora (solo guarda si la tasa cambió)
    - cron: '23 11-23 * * 1-5'           # días hábiles: cada hora de 7:23 a 19:23 hora de Venezuela
    - cron: '23 0-3 * * 2-6'             # y de 20:23 a 23:23 (el BCV suele publicar la del día siguiente en la tarde)
    - cron: '43 13,19,23 * * 0,6'        # fines de semana, tres veces
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/tasa-bcv.yml','tareas/tasa_bcv.py']
permissions:
  contents: write
concurrency: tasa-bcv
jobs:
  tasa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Descargar la página del BCV
        id: bcv
        continue-on-error: true
        run: |
          URL=https://www.bcv.org.ve/
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --max-time 60 -A "Mozilla/5.0" "$URL" -o bcv.html; then ok=1; break; fi
            # El sitio del BCV a veces no envía su certificado intermedio: lo bajamos de la dirección que indica su propio certificado
            # y verificamos igual contra las autoridades del sistema (no se desactiva la verificación).
            echo | openssl s_client -connect www.bcv.org.ve:443 -servername www.bcv.org.ve 2>/dev/null | openssl x509 -outform PEM > leaf.pem || true
            AIA=$(openssl x509 -in leaf.pem -noout -text 2>/dev/null | grep "CA Issuers" | head -1 | sed 's/.*URI://')
            if [ -n "$AIA" ] && curl -fsSL --max-time 30 "$AIA" -o inter.bin; then
              openssl x509 -inform DER -in inter.bin -out inter.pem 2>/dev/null || cp inter.bin inter.pem
              cat /etc/ssl/certs/ca-certificates.crt inter.pem > bundle.pem
              if curl -fsSL --max-time 60 -A "Mozilla/5.0" --cacert bundle.pem "$URL" -o bcv.html; then ok=1; break; fi
            fi
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "No pude descargar bcv.org.ve"; exit 1; }
      - name: Leer la tasa
        id: leer
        if: steps.bcv.outcome == 'success'
        continue-on-error: true
        run: python3 tareas/tasa_bcv.py bcv.html
      - name: Respaldo si la página del BCV falló (dolarapi replica la tasa oficial)
        if: steps.bcv.outcome != 'success' || steps.leer.outcome != 'success'
        run: |
          curl -fsSL --max-time 30 https://ve.dolarapi.com/v1/dolares/oficial -o api.json
          python3 - <<'PY'
          import json, datetime
          a = json.load(open('api.json')); usd = float(a.get('promedio') or 0); f = str(a.get('fechaActualizacion') or '')[:10]
          if usd <= 0 or len(f) != 10: raise SystemExit('ERROR: el respaldo no trajo una tasa válida')
          try: old = json.load(open('tasa.json'))
          except Exception: old = {}
          if old.get('fecha_valor') and f < old['fecha_valor']: raise SystemExit(0)   # nunca retroceder a una tasa más vieja
          if old.get('usd') == usd and old.get('fecha_valor') == f: raise SystemExit(0)
          h = [x for x in old.get('historial', []) if x.get('fecha') != f] + [{'fecha': f, 'usd': usd}]
          out = dict(old, usd=usd, fecha_valor=f, fecha_texto=None, fuente='BCV vía respaldo (dolarapi)',
                     actualizado=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), historial=h[-60:])
          json.dump(out, open('tasa.json', 'w'), ensure_ascii=False, indent=1); print('Respaldo OK', usd, f)
          PY
      - name: Guardar
        run: |
          rm -f bcv.html leaf.pem inter.bin inter.pem bundle.pem api.json
          if git diff --quiet -- tasa.json 2>/dev/null && git ls-files --error-unmatch tasa.json >/dev/null 2>&1; then echo "Sin cambios"; exit 0; fi
          git config user.name "Tasa BCV"; git config user.email "actions@users.noreply.github.com"
          git add tasa.json && git commit -m "Tasa BCV $(python3 -c "import json;d=json.load(open('tasa.json'));print(d['usd'],d['fecha_valor'])")" && git push
